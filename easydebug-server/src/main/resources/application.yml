server:
  port: ${EASYDEBUG_SERVER_PORT:8090}
  tomcat:
    max-http-form-post-size: 64MB
    max-swallow-size: -1

spring:
  application:
    name: easydebug-server
  datasource:
    url: ${EASYDEBUG_JDBC_URL:jdbc:h2:file:./data/easydebug;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${EASYDEBUG_JDBC_USER:sa}
    password: ${EASYDEBUG_JDBC_PASSWORD:}
  sql:
    init:
      mode: always
